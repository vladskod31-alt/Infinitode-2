name: Build APK

on:
  push:
    branches: [main, 'arena/**']
    paths: ['game/**', 'android/**', '.github/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: '1.0.0'

jobs:
  test:
    name: Game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tool deps
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Engine simulation test
        run: node tools/test-sim.mjs
      - name: UI smoke test
        run: node tools/test-ui.mjs

  build:
    name: Build & Release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --project-dir android --no-daemon --console=plain

      - name: Assemble release APK (signed)
        run: gradle :app:assembleRelease --project-dir android --no-daemon --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Infinitode4-v${VERSION_NAME}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Infinitode4-v${VERSION_NAME}-release.apk"
          ls -la dist
          du -h dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infinitode4-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating APKs"
            gh release upload "$TAG" dist/*.apk --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" dist/*.apk \
              --title "🚁 INFINITODE 4 v${VERSION_NAME}" \
              --notes-file .github/release-notes.md
          fi
