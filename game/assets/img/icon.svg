<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".55" stop-color="#141b3f"/>
      <stop offset="1" stop-color="#241040"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a7fff0"/>
      <stop offset=".45" stop-color="#39f5c8"/>
      <stop offset="1" stop-color="#0b6e5d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b96c9"/>
      <stop offset=".5" stop-color="#4a5480"/>
      <stop offset="1" stop-color="#232842"/>
    </linearGradient>
    <linearGradient id="metalD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a639a"/>
      <stop offset="1" stop-color="#1b2038"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39f5c8"/>
      <stop offset="1" stop-color="#2bb3ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset=".55" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#e07b12"/>
    </linearGradient>
    <linearGradient id="heliB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd968"/>
      <stop offset="1" stop-color="#c96a0e"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".46" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#grid)"/>
  <ellipse cx="512" cy="470" rx="430" ry="400" fill="#2bb3ff" opacity=".10"/>

  <!-- orbit rings -->
  <circle cx="512" cy="470" r="418" fill="none" stroke="#2bb3ff" stroke-opacity=".35" stroke-width="6" stroke-dasharray="4 26" stroke-linecap="round"/>
  <polygon points="512,140 226,305 226,635 512,800 798,635 798,305" fill="none" stroke="url(#neon)" stroke-width="26" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="512,168 250,319 250,621 512,772 774,621 774,319" fill="none" stroke="#39f5c8" stroke-opacity=".25" stroke-width="4"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="812" rx="200" ry="26" fill="#000" opacity=".5"/>

  <!-- tesla coils -->
  <g>
    <rect x="326" y="660" width="56" height="120" rx="10" fill="url(#metalD)" stroke="#3a4670" stroke-width="4"/>
    <rect x="316" y="644" width="76" height="26" rx="13" fill="url(#metal)" stroke="#9aa5d6" stroke-width="3"/>
    <polyline points="354,636 330,590 366,560 344,512" fill="none" stroke="#7df9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSm)"/>
    <rect x="642" y="660" width="56" height="120" rx="10" fill="url(#metalD)" stroke="#3a4670" stroke-width="4"/>
    <rect x="632" y="644" width="76" height="26" rx="13" fill="url(#metal)" stroke="#9aa5d6" stroke-width="3"/>
    <polyline points="670,636 694,590 658,560 680,512" fill="none" stroke="#7df9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSm)"/>
  </g>

  <!-- tower base -->
  <path d="M372 810 L652 810 L612 700 L412 700 Z" fill="url(#metalD)" stroke="#9aa5d6" stroke-width="5" stroke-linejoin="round"/>
  <path d="M424 810 L600 810 L592 736 L432 736 Z" fill="url(#metal)" opacity=".9"/>
  <circle cx="468" cy="773" r="9" fill="#39f5c8" filter="url(#glowSm)"/>
  <circle cx="512" cy="773" r="9" fill="#2bb3ff" filter="url(#glowSm)"/>
  <circle cx="556" cy="773" r="9" fill="#ff5d7e" filter="url(#glowSm)"/>
  <rect x="332" y="662" width="360" height="42" rx="14" fill="#232c4d" stroke="#4a5480" stroke-width="5"/>
  <rect x="344" y="668" width="336" height="10" rx="5" fill="#39f5c8" opacity=".5"/>

  <!-- column + core -->
  <rect x="474" y="498" width="76" height="170" fill="url(#metal)" stroke="#9aa5d6" stroke-width="4"/>
  <rect x="474" y="498" width="24" height="170" fill="#fff" opacity=".15"/>
  <circle cx="512" cy="583" r="72" fill="url(#coreGlow)" opacity=".8"/>
  <circle cx="512" cy="583" r="40" fill="#0b3f36" stroke="#39f5c8" stroke-width="8" filter="url(#glow)"/>
  <circle cx="512" cy="583" r="18" fill="#d8fff6"/>
  <circle cx="512" cy="583" r="56" fill="none" stroke="#39f5c8" stroke-width="4" stroke-dasharray="10 14" opacity=".8"/>

  <!-- head -->
  <rect x="402" y="428" width="220" height="82" rx="28" fill="url(#metal)" stroke="#c3cbf5" stroke-width="5"/>
  <path d="M424 428 Q512 372 600 428 Z" fill="url(#metalD)" stroke="#c3cbf5" stroke-width="5"/>
  <rect x="424" y="452" width="120" height="16" rx="8" fill="#39f5c8" opacity=".85" filter="url(#glowSm)"/>
  <!-- barrels -->
  <g transform="rotate(-26 600 470)">
    <rect x="598" y="446" width="180" height="26" rx="12" fill="url(#metalD)" stroke="#c3cbf5" stroke-width="4"/>
    <rect x="598" y="480" width="152" height="20" rx="10" fill="url(#metalD)" stroke="#c3cbf5" stroke-width="4"/>
    <circle cx="782" cy="459" r="12" fill="#39f5c8" filter="url(#glow)"/>
    <circle cx="754" cy="490" r="9" fill="#2bb3ff" filter="url(#glow)"/>
  </g>
  <!-- antenna -->
  <line x1="452" y1="428" x2="420" y2="348" stroke="#c3cbf5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="420" cy="340" r="14" fill="#ff5d7e" filter="url(#glow)"/>

  <!-- helicopter -->
  <g transform="translate(360 318) scale(.72)">
    <rect x="-78" y="-46" width="156" height="12" rx="6" fill="#e8ecff" opacity=".95"/>
    <rect x="-60" y="-58" width="120" height="8" rx="4" fill="#fff" opacity=".35"/>
    <rect x="-6" y="-46" width="12" height="26" fill="#5a639a"/>
    <rect x="-108" y="-20" width="70" height="16" rx="8" fill="url(#heliB)"/>
    <rect x="-116" y="-44" width="12" height="34" rx="5" fill="url(#heliB)"/>
    <ellipse cx="0" cy="0" rx="48" ry="27" fill="url(#heliB)" stroke="#7a3d05" stroke-width="4"/>
    <ellipse cx="20" cy="-4" rx="19" ry="14" fill="#bfe9ff" stroke="#7a3d05" stroke-width="3"/>
    <line x1="-28" y1="27" x2="-28" y2="44" stroke="#7a3d05" stroke-width="6"/>
    <line x1="24" y1="27" x2="24" y2="44" stroke="#7a3d05" stroke-width="6"/>
    <line x1="-48" y1="46" x2="46" y2="46" stroke="#7a3d05" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-38" cy="2" r="6" fill="#ff5d7e" filter="url(#glowSm)"/>
  </g>

  <!-- level 4 badge -->
  <g>
    <circle cx="796" cy="792" r="112" fill="url(#gold)" stroke="#5b2d00" stroke-width="10"/>
    <circle cx="796" cy="792" r="92" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5"/>
    <rect x="752" y="732" width="24" height="72" rx="8" fill="#fff"/>
    <rect x="752" y="794" width="94" height="24" rx="8" fill="#fff"/>
    <rect x="822" y="732" width="24" height="112" rx="8" fill="#fff"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <path d="M180 250 l10 22 22 10 -22 10 -10 22 -10 -22 -22 -10 22 -10z" opacity=".9"/>
    <path d="M856 420 l7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7z" opacity=".7"/>
    <path d="M150 640 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z" opacity=".6"/>
    <circle cx="880" cy="580" r="8" opacity=".8"/>
    <circle cx="120" cy="420" r="6" opacity=".7"/>
  </g>

  <rect width="1024" height="1024" rx="232" fill="url(#vig)"/>
  <rect x="14" y="14" width="996" height="996" rx="220" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6"/>
</svg>
